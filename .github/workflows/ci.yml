name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-12
          components: rustfmt
      - run: cargo +nightly-2026-03-12 fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            .tools/ghostty-src/.zig-cache/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock', 'tools/ghostty-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - run: ./tools/prepare-ghostty-vt.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: fmt
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/.tools/ghostty-install/lib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            .tools/ghostty-src/.zig-cache/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock', 'tools/ghostty-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - run: ./tools/prepare-ghostty-vt.sh
      - run: cargo test --workspace --locked

  no-vt:
    name: No-VT variant
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-no-vt-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-no-vt-
      - run: cargo build -p cleat --locked --no-default-features
      - run: cargo test -p cleat --locked --no-default-features

  macos-transfer:
    name: macOS transfer primitives
    runs-on: macos-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p cleat --all-targets --locked --no-default-features -- -D warnings
      - run: cargo test -p cleat --locked --no-default-features --test fd_transfer --test transfer_state --test child_observation

  windows-core:
    name: Windows build and core tests
    runs-on: windows-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Compile the application and exercise named-pipe/provider behavior
      # without making this portability gate depend on a Ghostty build.
      # The bundled ConPTY is staged so the graphics pass-through regression
      # runs against it (ADR 0006).
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/prepare-conpty.ps1
      # The Linux Clippy job never compiles #[cfg(windows)] code; lint it here.
      - run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      - run: cargo build -p cleat --locked --no-default-features
      - run: cargo test -p cleat --locked --no-default-features --lib
      - run: cargo test -p cleat --locked --no-default-features --test windows_daemon_launch
      - run: cargo test -p cleat --locked --no-default-features --test attach_existing

  windows-ghostty-vt:
    name: Windows Ghostty VT build and test
    runs-on: windows-latest
    needs: fmt
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The prepared Ghostty install and bundled ConPTY depend only on the pins
      # and the scripts that realise them, so an exact-key hit skips Zig and the
      # Ghostty build entirely. A pin or script change misses and re-prepares.
      - id: ghostty-cache
        uses: actions/cache@v4
        with:
          path: |
            .tools/ghostty-install/
            .tools/conpty/
          key: ${{ runner.os }}-ghostty-vt-${{ hashFiles('tools/ghostty-toolchain.toml', 'tools/conpty.toml', 'tools/prepare-ghostty-vt.ps1', 'tools/prepare-conpty.ps1', 'tools/install-zig.ps1') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-ghostty-vt-${{ hashFiles('Cargo.lock', 'tools/ghostty-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ghostty-vt-
      - if: steps.ghostty-cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Prepare Ghostty VT (SIMD) and bundled ConPTY
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/prepare-ghostty-vt.ps1
      - name: Clippy with Ghostty VT
        run: cargo clippy --workspace --all-targets --locked --features cleat/ghostty-vt -- -D warnings
      - name: Build functional binary and cleat.dll
        run: cargo build -p cleat --locked --features ghostty-vt
      # Loading the cdylib resolves its ghostty-vt.dll import and runs both
      # DllMains, which catches import/link regressions the tests cannot see.
      - name: Check cleat.dll loads against ghostty-vt.dll
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'target\debug'
          foreach ($file in 'cleat.exe', 'cleat.dll', 'ghostty-vt.dll', 'conpty.dll', 'OpenConsole.exe') {
            if (!(Test-Path (Join-Path $out $file))) { throw "missing $out\$file" }
          }
          Add-Type -Namespace Win32 -Name Kernel32 -MemberDefinition '[DllImport("kernel32", SetLastError = true, CharSet = CharSet.Unicode)] public static extern IntPtr LoadLibraryExW(string path, IntPtr file, uint flags);'
          $dll = (Resolve-Path (Join-Path $out 'cleat.dll')).Path
          # LOAD_WITH_ALTERED_SEARCH_PATH: resolve imports beside cleat.dll.
          if ([Win32.Kernel32]::LoadLibraryExW($dll, [IntPtr]::Zero, 8) -eq [IntPtr]::Zero) {
            throw "LoadLibraryExW($dll) failed: Win32 error $([Runtime.InteropServices.Marshal]::GetLastWin32Error())"
          }
      - name: Test workspace with Ghostty VT
        run: cargo test --workspace --locked --features cleat/ghostty-vt
