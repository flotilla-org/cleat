[package]
name = "cleat"
version = "0.1.0"
edition = "2021"
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
ghostty-vt = ["dep:png"]

[dependencies]
bitflags = "2"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
http = "1"
httparse = "1"
humantime = "2"
serde = { workspace = true }
serde_json = { workspace = true }
libc = "0.2"
nix = { version = "0.31.2", features = ["fs", "poll", "process", "signal", "term"] }
png = { version = "0.17", optional = true }
sysinfo = "0.38"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
