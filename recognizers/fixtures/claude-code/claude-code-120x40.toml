# Expectations stub for #353; local fixture schema, not recognizer rules.
# Rows and columns are 1-indexed screen coordinates. composer.placeholder is
# documentation only (random per launch): recognizers must not match on it.
cast = "claude-code-120x40.cast"
harness = "Claude Code 2.1.287"
composer.placeholder = "Try \"refactor <filepath>\""

[[expect]]
marker = "empty"
screen = "120x40"
roles = ["composer"]
composer.value = ""
composer.placeholder_visible = true
composer.first_row = 38
composer.row_count = 1
composer.cursor.row = 38
composer.cursor.col = 3
composer.cursor.offset = 0

[[expect]]
marker = "draft"
screen = "120x40"
roles = ["composer"]
composer.value = "list the files here"
composer.placeholder_visible = false
composer.first_row = 38
composer.row_count = 1
composer.cursor.row = 38
composer.cursor.col = 22
composer.cursor.offset = 19

