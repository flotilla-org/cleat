# Executable marker contract for codex-cli 0.162.1

[[marker]]
name = "empty"
state = "idle"
role = [
  { role = "composer", value = "" },
  { role = "status", value = "", state = "idle" },
]

[[marker]]
name = "draft"
state = "idle"
role = [
  { role = "composer", value = "Describe the throwaway file." },
  { role = "status", value = "", state = "idle" },
]

[[marker]]
name = "working"
state = "working"
role = [
  { role = "composer", value = "" },
  { role = "status", value = "", state = "working" },
]

[[marker]]
name = "done"
contains = ["Worked for"]
state = "idle"
role = [
  { role = "composer", value = "" },
  { role = "status", value = "", state = "idle" },
]

[[marker]]
name = "approval"
state = "blocked"
role = [{ role = "dialog", value = "", kind = "approval", state = "blocked" }]
