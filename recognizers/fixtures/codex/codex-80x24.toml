# Executable marker contract for codex-cli 0.160.0

[[marker]]
name = "empty"
state = "idle"
role = [
  { role = "composer", value = "" },
  { role = "status", value = "", state = "idle" },
]

[[marker]]
name = "draft"
state = "idle"
role = [
  { role = "composer", value = "Describe the throwaway file." },
  { role = "status", value = "", state = "idle" },
]

[[marker]]
name = "draft-placeholder-words"
state = "idle"
role = [
  { role = "composer", value = "Ask Codex to do anything with this draft" },
  { role = "status", value = "", state = "idle" },
]

[[marker]]
name = "draft-multiline"
state = "idle"
role = [
  { role = "composer", value = "First throwaway line\nSecond throwaway line" },
  { role = "status", value = "", state = "idle" },
]

[[marker]]
name = "draft-space"
state = "idle"
role = [
  { role = "composer", value = "   " },
  { role = "status", value = "", state = "idle" },
]

[[marker]]
name = "draft-cursor-left"
state = "idle"
role = [
  { role = "composer", value = "Text after cursor" },
  { role = "status", value = "", state = "idle" },
]

[[marker]]
name = "working"
state = "working"
role = [
  { role = "composer", value = "" },
  { role = "status", value = "", state = "working" },
]

[[marker]]
name = "approval"
state = "blocked"
role = [{ role = "dialog", value = "", kind = "approval", state = "blocked" }]

[[marker]]
name = "done"
contains = ["Worked for"]
state = "idle"
role = [
  { role = "composer", value = "" },
  { role = "status", value = "", state = "idle" },
]

[[marker]]
name = "resize-shrunk"
state = "idle"
role = [
  { role = "composer", value = "" },
  { role = "status", value = "", state = "idle" },
]

[[marker]]
name = "resize"
state = "idle"
role = [
  { role = "composer", value = "" },
  { role = "status", value = "", state = "idle" },
]
