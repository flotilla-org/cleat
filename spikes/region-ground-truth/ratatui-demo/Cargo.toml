[package]
name = "ratatui-region-demo"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not a member of the cleat workspace.
[workspace]

[dependencies]
ratatui = "=0.30.0"
ratatui-core = "=0.1.0"

# ../prepare.sh vendors ratatui-core 0.1.0 and ratatui-widgets 0.3.0 from the
# Cargo registry, applies ../ratatui-regions.patch, and links them here.
[patch.crates-io]
ratatui-core = { path = "vendor/ratatui-core" }
ratatui-widgets = { path = "vendor/ratatui-widgets" }
