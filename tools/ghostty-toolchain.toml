[zig]
version = "0.15.2"

# We pin a fork rather than upstream ghostty because cleat depends on
# libghostty-vt work not yet upstreamed: the C VT library emit step
# (-Demit-lib-vt), the virtual-placement resolver, and Kitty relative-placement
# resolution (P/Q/H/V + virtual parent). `ref` is the `cleat-integration` head,
# which merges those feature branches onto ghostty main with --no-ff.
#
# Maintenance: bumping `ref` is a pin update, not an API change, as long as the
# vendored include/ghostty/*.h headers are byte-identical across the bump (the
# changes are behavioural). If a header diff appears, the FFI bindings in
# crates/cleat/src/vt/ghostty_ffi.rs must be reviewed before accepting it. As the
# libvt branches upstream, retire this fork and re-pin to ghostty-org/ghostty.
[ghostty]
repo = "https://github.com/rjwittams/ghostty.git"
ref = "64daa599c531e6938bc4c52d9198a91f1e6ce8cf"
build_step = "-Demit-lib-vt=true -Dsimd=true"
