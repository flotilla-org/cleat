[zig]
version = "0.16.0"

# The fork retains the virtual-placement C API, temporary-file read/deletion
# policy, raw-file reads without S, empty-source renderer guard, and simdutf
# MSVC initialization fix. Windows import libraries expose only the public API.
# Ordinary relative placements now come from upstream. Scoped history capture
# adds explicit-screen tracked origins without consuming live render dirtiness.
# Audit all used C bindings whenever this pin changes; headers and option
# semantics are not stable. See docs/ghostty-migration-2026-09.md.
[ghostty]
repo = "https://github.com/rjwittams/ghostty.git"
ref = "c3dbb925e6cbcfceafba5749f81a486dd2275099"
# -Doptimize matters: zig defaults to Debug, and a Debug libghostty-vt feeds
# scroll-heavy output at ~KB/s — slow enough to wedge session actors behind
# PTY floods. ReleaseSafe keeps bounds checks on untrusted terminal input.
build_step = "-Demit-lib-vt=true -Dsimd=true -Doptimize=ReleaseSafe"

